[workspace]
members = ["macros", "macros_impl"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[package]
name = "trait-rpc"
version.workspace = true
edition.workspace = true

[workspace.lints.rust]
unsafe_code = "forbid"

[lints]
workspace = true

[workspace.lints.clippy]
pedantic = { level = "warn" }
nursery = { level = "warn" } # warn nursery by default, allow annooying lints below
missing_errors_doc = { level = "allow", priority = 1 }
missing_panics_doc = { level = "allow", priority = 1 }
allow_attributes_without_reason = { level = "warn", priority = 1 }
unused_async_trait_impl = { level = "allow", priority = 1 }
missing_const_for_fn = { level = "allow", priority = 1 }


[features]
axum-websocket = ["dep:axum", "dep:tower"]
browser-websocket = ["dep:web-sys", "dep:wasm-bindgen-futures", "dep:gloo-net", "dep:gloo-timers", "send_wrapper"]
tokio_tungstenite = ["dep:tokio-tungstenite", "tokio"]
tokio = ["dep:tokio"]

# Formats
json = ["serde", "dep:serde_json"]
browser-json = ["serde", "dep:serde-wasm-bindgen", "dep:web-sys", "dep:wasm-bindgen-futures"]
cbor = ["serde", "dep:ciborium"]

# Internal helper features for CI/CD, defined in a single place to avoid mistakes when adding/removeing features
__test = ["axum-websocket", "json", "cbor", "tokio_tungstenite", "dep:tokio"]
__wasm_test = ["json", "cbor", "browser-websocket", "browser-json"]

[dependencies]
serde = { version = "1.0.229", optional = true }
bon = "3.10.2"
thiserror = "2.0.21"
axum = { version = "0.8.9", optional = true, features = ["ws"]}
tower = { version = "0.5.3", optional = true }
macros = { package = "trait-rpc-macros", path = "macros" }
futures = { version = "0.3.34", features = ["unstable", "bilock"] }
tracing = "0.1.44"
pin-project = "1.1.13"
derive_more = { version = "2.1.1", features = ["from", "display", "try_from", "into"] }
async-channel = "2.5.0"
pastey = "0.2.3"
whirlwind = "0.1.1"
async-lock = "3.4.2"

# Formats
serde_json = { version = "1.0.154", optional = true }
ciborium = { version = "0.2.2", optional = true }
log = "0.4.34"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = { version = "0.4", optional = true }
serde-wasm-bindgen = { version = "0.6", optional = true }
gloo-net = { version = "0.7.0", optional = true, features = ["websocket"] }
gloo-timers = { version = "0.4.0", optional = true, features = ["futures"] }
send_wrapper = { version = "0.6.0", optional = true, features = ["futures"] }

[target.'cfg(target_arch = "wasm32")'.dependencies.web-sys]
version = "0.3"
optional = true
features = ["Window", "Request", "Response", "RequestInit", "RequestMode", "ReadableStream", "Headers"]

[target.'cfg(not(target_arch="wasm32"))'.dependencies]
tokio = { version = "1.54.1", features = ["full"], optional = true }
tokio-tungstenite = { version = "0.30.0", optional = true }

[dev-dependencies]
derive_more = { version = "2.1.1", features = ["full"] }
axum-extra = { version = "0.12.6", features = ["typed-header"] }
async-executor = "1.14.0"
tracing = { version = "0.1.44", features = ["log"] }
simple_logger = "5.2.0"
tokio-stream = { version = "0.1.19", features = ["sync"] }

[target.'cfg(not(target_arch="wasm32"))'.dev-dependencies]
axum = { version = "0.8.9", features = ["ws", "macros"]}
proptest = "1.12.0"
proptest-derive = "0.9.0"

[build-dependencies]
cfg_aliases = "0.2.2"

[[example]]
name = "todo_client"
required-features = ["__test"]

[[example]]
name = "wasm_client"
required-features = ["__wasm_test"]

[[example]]
name = "todo_server"
required-features = ["__test"]

[[example]]
name = "resources_server"
required-features = ["__test"]

[[test]]
name = "websocket"
required-features = ["__test"]
